<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#120a1a">
<title>Admin – Süßes oder Saures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
body{display:grid;grid-template-columns:400px 1fr;height:100dvh}
aside{display:flex;flex-direction:column;min-height:0;background:#190f26;border-right:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.head a{color:var(--slime);font-size:14px}
form{display:grid;gap:12px;padding:0 16px 16px;border-bottom:1px solid var(--line)}
label{font-size:13px;color:var(--muted)}
input[type=text]{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:0;margin:0;padding:0}
.types legend{font-size:13px;color:var(--muted);padding:0;margin-bottom:6px}
.types label{position:relative;display:grid;justify-items:center;gap:2px;padding:10px 4px;border:2px solid var(--line);border-radius:12px;color:var(--text);font-size:12px;text-align:center;cursor:pointer}
.types input{position:absolute;opacity:0}
.types .e{font-size:24px}
.types label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.types label:has(input:focus-visible){outline:3px solid var(--slime)}
.primary{min-height:48px;border:0;border-radius:12px;background:var(--orange);color:#120a1a;font-weight:700}
.ghost{min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted)}
#msg{min-height:18px;font-size:13px;color:var(--slime)}
#msg.err{color:#ff7b7b}
#list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#list li{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
#list li:hover{background:#241533}
#list .ic{font-size:22px}
#list .t{flex:1;min-width:0}
#list b,#list small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list small{color:var(--muted)}
#list .del{width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:22px}
.empty{padding:16px;color:var(--muted);font-size:14px}
.tools{display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.hint{margin:0;font-size:12px;color:var(--muted)}
#draft{display:none;font-size:12px;font-weight:700;color:var(--orange)}
#map{height:100%}
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:38dvh 1fr}
  #map{order:-1}
  aside{border-right:0;border-top:1px solid var(--line);overflow:auto}
  #list{flex:none;overflow:visible}
  input[type=text]{font-size:16px}
}
</style>
</head>
<body>
<aside>
  <div class="head"><h1>🎃 Admin</h1><span id="draft">Entwurf</span><a href="index.html">Zur Karte</a></div>
  <form id="form">
    <fieldset class="types" id="types"><legend>Art des Ortes</legend></fieldset>
    <div><label for="name">Name oder Notiz</label><input type="text" id="name" placeholder="z. B. Familie Meier"></div>
    <div><label for="addr">Adresse</label><input type="text" id="addr" required autocomplete="street-address" placeholder="Straße Hausnummer, Ort"></div>
    <button class="primary" type="submit">Auf die Karte setzen</button>
    <div id="msg" role="status"></div>
  </form>
  <ul id="list"></ul>
  <div class="tools">
    <button class="primary" id="dl" type="button">adressen.json herunterladen</button>
    <p class="hint">Datei im Repo ersetzen, dann sehen alle die neue Karte.</p>
    <button class="ghost" id="reset" type="button">Veröffentlichten Stand laden</button>
  </div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="common.js"></script>
<script>
const KEY = "halloween-admin-entwurf-v2";
let spots = [];
const $ = id => document.getElementById(id);
const say = (t, err) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(spots)); } catch (e) {} $("draft").style.display = "inline"; };
const map = newMap("map");
const markers = new Map();

Object.keys(TYPES).forEach((k, i) => {
  const l = document.createElement("label");
  l.style.setProperty("--c", TYPES[k].color);
  l.innerHTML = `<input type="radio" name="typ" value="${k}" ${i === 2 ? "checked" : ""}><span class="e">${TYPES[k].emoji}</span>${TYPES[k].short}`;
  $("types").appendChild(l);
});

function render() {
  markers.forEach(m => m.remove()); markers.clear();
  const ul = $("list");
  ul.innerHTML = spots.length ? "" : '<li class="empty">Noch keine Orte. Trag den ersten ein.</li>';
  spots.forEach(s => {
    const k = typeOf(s);
    const m = L.marker([s.lat, s.lon], { icon: pinIcon(k) }).addTo(map).bindPopup(popupHtml(s));
    markers.set(s.id, m);
    const li = document.createElement("li");
    li.innerHTML = `<span class="ic">${TYPES[k].emoji}</span><div class="t"><b>${esc(s.name || TYPES[k].label)}</b><small>${esc(s.addr)}</small></div><button class="del" aria-label="Eintrag löschen">×</button>`;
    li.onclick = () => { map.flyTo([s.lat, s.lon], 17); m.openPopup(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    li.querySelector(".del").onclick = e => { e.stopPropagation(); spots = spots.filter(x => x.id !== s.id); save(); render(); };
    ul.appendChild(li);
  });
}

async function loadPublished() {
  try {
    spots = await (await fetch("adressen.json?t=" + Date.now())).json();
    try { localStorage.removeItem(KEY); } catch (e) {}
    $("draft").style.display = "none"; render(); fitTo(map, spots); say("Veröffentlichter Stand geladen.");
  } catch (e) { say("adressen.json nicht gefunden. Du startest leer.", true); render(); }
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const addr = $("addr").value.trim(); if (!addr) return;
  say("Suche Adresse …");
  try {
    const d = await (await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q=" + encodeURIComponent(addr))).json();
    if (!d.length) return say("Adresse nicht gefunden. Prüf Straße, Hausnummer und Ort.", true);
    const s = { id: Date.now().toString(36), typ: document.querySelector("[name=typ]:checked").value, name: $("name").value.trim(),
                addr: d[0].display_name.split(", ").slice(0, 4).join(", "), lat: +d[0].lat, lon: +d[0].lon };
    spots.push(s); save(); render();
    map.flyTo([s.lat, s.lon], 17); markers.get(s.id).openPopup();
    $("name").value = ""; $("addr").value = ""; say("Hinzugefügt. Zum Veröffentlichen die Datei herunterladen.");
  } catch (err) { say("Adresssuche gerade nicht erreichbar. Versuch es gleich nochmal.", true); }
};

$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(spots, null, 2)], { type: "application/json" }));
  a.download = "adressen.json"; a.click();
};
$("reset").onclick = () => { if ($("draft").style.display !== "inline" || confirm("Ungeveröffentlichte Änderungen verwerfen?")) loadPublished(); };

(async () => {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (draft) { spots = draft; $("draft").style.display = "inline"; render(); fitTo(map, spots); } else await loadPublished();
})();
</script>
</body>
</html>
