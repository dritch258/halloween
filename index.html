<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a1a">
<title>Halloween</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
#map{position:fixed;inset:0}
.top small{color:var(--muted);font-size:13px}
.chips{position:fixed;z-index:1000;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 6px;font-size:14px;white-space:nowrap;color:var(--text);background:var(--surf);border:2px solid var(--c);border-radius:16px;backdrop-filter:blur(10px)}
.chip[aria-pressed=false]{border-color:var(--line);color:var(--muted);opacity:.7}
.loc{position:fixed;z-index:1000;right:12px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--text);font-size:20px;backdrop-filter:blur(10px)}
@media(min-width:700px){.chips{left:50%;right:auto;transform:translateX(-50%);width:520px}.loc{bottom:90px}}
#cnt{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;min-height:36px;padding:0}
.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 24px 6px;background:var(--surf);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(10px)}
.sheet{display:none;flex-direction:column;position:fixed;z-index:1001;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 24px));top:calc(max(12px,env(safe-area-inset-top)) + 84px);max-height:60dvh;background:var(--surf);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);overflow:hidden}
.sheet.open{display:flex}
#q{margin:10px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:16px}
#slist{list-style:none;margin:0;padding:0;overflow:auto}
.grp{position:sticky;top:0;padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c);background:#1b1029;border-bottom:1px solid var(--line)}
.sheet li:not(.grp):not(.none){display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.sheet li:not(.grp):not(.none):active{background:rgba(255,255,255,.08)}
.none{padding:16px;color:var(--muted)}
.sheet li>span{font-size:22px}
.sheet li div{min-width:0}
.sheet b,.sheet small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet small{color:var(--muted)}
.leaflet-bottom{margin-bottom:76px}
@media(pointer:coarse){.leaflet-control-zoom{display:none}}
@media(max-width:480px){.top{padding:8px 18px 4px}.top h1{font-size:22px}.top small{font-size:12px}.chip{font-size:13px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><h1>🎃 Halloween 🎃</h1><button id="cnt" aria-expanded="false" aria-controls="sheet"></button></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Adressen"><input type="search" id="q" placeholder="Suchen …" aria-label="Adressen durchsuchen"><ul id="slist"></ul></div>
<button class="loc" id="loc" aria-label="Meinen Standort anzeigen">📍</button>
<nav class="chips" id="chips" aria-label="Filter"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="common.js"></script>
<script>
const map = newMap("map");
const groups = {}, btns = {}, $ = id => document.getElementById(id);
const chips = document.getElementById("chips");
Object.keys(TYPES).forEach(k => {
  groups[k] = L.layerGroup().addTo(map);
  const b = document.createElement("button");
  b.className = "chip"; b.style.setProperty("--c", TYPES[k].color); b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span>${TYPES[k].emoji}</span>${TYPES[k].short}`;
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", on);
    on ? groups[k].addTo(map) : map.removeLayer(groups[k]);
  };
  btns[k] = b; chips.appendChild(b);
});

let stand = "";
fetch("adressen.json?t=" + Date.now()).then(r => { stand = r.headers.get("Last-Modified") || ""; return r.json(); }).then(spots => {
  const cnt = $("cnt"), sheet = $("sheet"), list = $("slist"), q = $("q"), marks = new Map();
  spots.forEach(s => { const k = typeOf(s);
    marks.set(s, L.marker([s.lat, s.lon], { icon: pinIcon(k), title: s.name || "" }).bindPopup(popupHtml(s)).addTo(groups[k])); });
  const close = () => { sheet.classList.remove("open"); cnt.setAttribute("aria-expanded", "false"); };
  q.hidden = spots.length <= 6;
  const fill = () => {
    const t = q.value.trim().toLowerCase();
    list.innerHTML = "";
    Object.keys(TYPES).forEach(k => {
      const items = spots.filter(s => typeOf(s) === k && ((s.name || "") + " " + s.addr).toLowerCase().includes(t))
        .sort((a, b) => (a.name || a.addr).localeCompare(b.name || b.addr, "de"));
      if (!items.length) return;
      const g = document.createElement("li");
      g.className = "grp"; g.style.setProperty("--c", TYPES[k].color);
      g.textContent = TYPES[k].emoji + " " + TYPES[k].label + " \u00b7 " + items.length;
      list.appendChild(g);
      items.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${TYPES[k].emoji}</span><div>${s.name ? `<b>${esc(s.name)}</b>` : ""}<small>${esc(s.addr)}</small></div>`;
        li.onclick = () => {
          if (btns[k].getAttribute("aria-pressed") !== "true") btns[k].click();
          close(); map.flyTo([s.lat, s.lon], 17); marks.get(s).openPopup();
        };
        list.appendChild(li);
      });
    });
    if (!list.children.length) list.innerHTML = '<li class="none">Keine Treffer.</li>';
  };
  q.oninput = fill;
  const d = stand && new Date(stand);
  cnt.textContent = !spots.length ? "Noch keine Adressen" : (d && !isNaN(d) ? "Aktualisiert: " + d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "Adressen") + " \u25BE";
  cnt.onclick = () => { if (!spots.length) return; if (sheet.classList.contains("open")) return close(); fill(); sheet.classList.add("open"); cnt.setAttribute("aria-expanded", "true"); };
  map.on("click", close);
  fitTo(map, spots);
}).catch(() => { $("cnt").textContent = "Daten nicht ladbar"; });

let me;
document.getElementById("loc").onclick = () => map.locate({ setView: true, maxZoom: 16 });
map.on("locationfound", e => { me && me.remove(); me = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 3, fillColor: "#3b82f6", fillOpacity: 1 }).addTo(map); });
map.on("locationerror", () => alert("Standort nicht verfügbar. Prüf die Freigabe im Browser."));
</script>
</body>
</html>
