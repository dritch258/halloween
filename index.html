<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a1a">
<title>Halloween 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<style>
#map{position:fixed;inset:0}
.top{position:fixed;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;max-width:calc(100% - 24px);display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surf);border:1px solid var(--line);border-radius:99px;backdrop-filter:blur(10px)}
.top small{color:var(--muted);font-size:13px}
.chips{position:fixed;z-index:1000;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 6px;font-size:14px;white-space:nowrap;color:var(--text);background:var(--surf);border:2px solid var(--c);border-radius:16px;backdrop-filter:blur(10px)}
.chip[aria-pressed=false]{border-color:var(--line);color:var(--muted);opacity:.7}
.loc{position:fixed;z-index:1000;right:12px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--text);font-size:20px;backdrop-filter:blur(10px)}
@media(min-width:700px){.chips{left:50%;right:auto;transform:translateX(-50%);width:520px}.loc{bottom:90px}}
#cnt{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;min-height:36px;padding:0}
.sheet{display:none;position:fixed;z-index:1001;left:12px;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 64px);max-height:55dvh;overflow:auto;margin:0;padding:0;list-style:none;background:var(--surf);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px)}
.sheet.open{display:block}
.sheet li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.sheet li:last-child{border-bottom:0}
.sheet li:active{background:rgba(255,255,255,.08)}
.sheet li>span{font-size:22px}
.sheet b,.sheet small{display:block}
.sheet small{color:var(--muted)}
@media(min-width:700px){.sheet{right:auto;width:380px}}
.leaflet-bottom{margin-bottom:76px}
@media(pointer:coarse){.leaflet-control-zoom{display:none}}
@media(max-width:480px){.top{padding:8px 14px;gap:8px}.top h1{font-size:22px}.top small{font-size:12px}.chip{font-size:13px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><h1>🎃 Halloween 2026</h1><button id="cnt" aria-expanded="false" aria-controls="sheet"></button></div>
<ul class="sheet" id="sheet" aria-label="Adressen"></ul>
<button class="loc" id="loc" aria-label="Meinen Standort anzeigen">📍</button>
<nav class="chips" id="chips" aria-label="Filter"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="common.js"></script>
<script>
const map = newMap("map");
const groups = {}, btns = {}, $ = id => document.getElementById(id);
const chips = document.getElementById("chips");
Object.keys(TYPES).forEach(k => {
  groups[k] = L.layerGroup().addTo(map);
  const b = document.createElement("button");
  b.className = "chip"; b.style.setProperty("--c", TYPES[k].color); b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span>${TYPES[k].emoji}</span>${TYPES[k].short}`;
  b.onclick = () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", on);
    on ? groups[k].addTo(map) : map.removeLayer(groups[k]);
  };
  btns[k] = b; chips.appendChild(b);
});

fetch("adressen.json?t=" + Date.now()).then(r => r.json()).then(spots => {
  const cnt = $("cnt"), sheet = $("sheet");
  spots.forEach(s => {
    const k = typeOf(s);
    const m = L.marker([s.lat, s.lon], { icon: pinIcon(k), title: s.name || "" }).bindPopup(popupHtml(s)).addTo(groups[k]);
    const li = document.createElement("li");
    li.innerHTML = `<span>${TYPES[k].emoji}</span><div>${s.name ? `<b>${esc(s.name)}</b>` : ""}<small>${esc(s.addr)}</small></div>`;
    li.onclick = () => {
      if (btns[k].getAttribute("aria-pressed") !== "true") btns[k].click();
      sheet.classList.remove("open"); cnt.setAttribute("aria-expanded", "false");
      map.flyTo([s.lat, s.lon], 17); m.openPopup();
    };
    sheet.appendChild(li);
  });
  cnt.textContent = spots.length ? spots.length + (spots.length === 1 ? " Adresse" : " Adressen") : "Noch keine Adressen";
  cnt.onclick = () => { if (!spots.length) return; const o = sheet.classList.toggle("open"); cnt.setAttribute("aria-expanded", o); };
  map.on("click", () => { sheet.classList.remove("open"); cnt.setAttribute("aria-expanded", "false"); });
  fitTo(map, spots);
}).catch(() => { $("cnt").textContent = "Daten nicht ladbar"; });

let me;
document.getElementById("loc").onclick = () => map.locate({ setView: true, maxZoom: 16 });
map.on("locationfound", e => { me && me.remove(); me = L.circleMarker(e.latlng, { radius: 8, color: "#fff", weight: 3, fillColor: "#3b82f6", fillOpacity: 1 }).addTo(map); });
map.on("locationerror", () => alert("Standort nicht verfügbar. Prüf die Freigabe im Browser."));
</script>
</body>
</html>
